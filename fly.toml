# fly.toml app configuration file generated for cardsvault on 2026-11-20T18:26:28Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'cardsvault'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
